name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Vision.apk
          cp build-output/Vision.apk build-output/PorteiroVision.apk
          ls -la build-output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision-APK
          path: build-output/Vision.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-apk
          name: "Vision v2.0.0 (Android APK)"
          body: |
            ### Vision - Aplicativo Oficial para Tablet / TV Box (Android)
            
            - 👁️ **Kiosk Fullscreen:** Oculta barras de navegação do Android com foco total nas câmeras.
            - ⚡ **Tela Sempre Acesa:** Impede o tablet de desligar a tela durante a vigilância ativa.
            - 🚀 **Zero Latência:** Conexão direta com a central local Vision (`http://192.168.4.127:8090`).
            - 💤 **Modo Standby & Noturno:** Patrulha inteligente com despertar instantâneo por movimento.
          files: |
            build-output/Vision.apk
            build-output/PorteiroVision.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
